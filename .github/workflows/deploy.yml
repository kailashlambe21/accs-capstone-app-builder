name: Deploy App Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install AIO CLI
        run: npm install -g @adobe/aio-cli

      - name: Create .env for deployment
        env:
          AIO_RUNTIME_NAMESPACE: ${{ secrets.AIO_RUNTIME_NAMESPACE }}
          AIO_RUNTIME_AUTH: ${{ secrets.AIO_RUNTIME_AUTH }}
          IMS_OAUTH_S2S_CLIENT_ID: ${{ secrets.IMS_OAUTH_S2S_CLIENT_ID }}
          IMS_OAUTH_S2S_CLIENT_SECRET: ${{ secrets.IMS_OAUTH_S2S_CLIENT_SECRET }}
          IMS_OAUTH_S2S_ORG_ID: ${{ secrets.IMS_OAUTH_S2S_ORG_ID }}
          IMS_OAUTH_S2S_SCOPES: ${{ secrets.IMS_OAUTH_S2S_SCOPES }}
          COMMERCE_API_BASE_URL: ${{ secrets.COMMERCE_API_BASE_URL }}
          COMMERCE_STORE_CODE: ${{ secrets.COMMERCE_STORE_CODE }}
        run: |
          echo "AIO_runtime_namespace=$AIO_RUNTIME_NAMESPACE" >> .env
          echo "AIO_runtime_auth=$AIO_RUNTIME_AUTH" >> .env
          echo "IMS_OAUTH_S2S_CLIENT_ID=$IMS_OAUTH_S2S_CLIENT_ID" >> .env
          echo "IMS_OAUTH_S2S_CLIENT_SECRET=$IMS_OAUTH_S2S_CLIENT_SECRET" >> .env
          echo "IMS_OAUTH_S2S_ORG_ID=$IMS_OAUTH_S2S_ORG_ID" >> .env
          echo "IMS_OAUTH_S2S_SCOPES=$IMS_OAUTH_S2S_SCOPES" >> .env
          echo "COMMERCE_API_BASE_URL=$COMMERCE_API_BASE_URL" >> .env
          echo "COMMERCE_STORE_CODE=$COMMERCE_STORE_CODE" >> .env

      - name: Configure AIO CLI for CI
        env:
          IMS_CLIENT_ID: ${{ secrets.IMS_OAUTH_S2S_CLIENT_ID }}
          IMS_CLIENT_SECRET: ${{ secrets.IMS_OAUTH_S2S_CLIENT_SECRET }}
          IMS_ORG_ID: ${{ secrets.IMS_OAUTH_S2S_ORG_ID }}
          IMS_SCOPES: ${{ secrets.IMS_OAUTH_S2S_SCOPES }}
        run: |
          CONTEXT="oauth_s2s_3967933-389wheatplanarian-capstone"
          aio config set "ims.contexts.${CONTEXT}.client_id" "$IMS_CLIENT_ID"
          aio config set "ims.contexts.${CONTEXT}.client_secrets" "[\"$IMS_CLIENT_SECRET\"]" --json
          aio config set "ims.contexts.${CONTEXT}.ims_org_id" "$IMS_ORG_ID"
          aio config set "ims.contexts.${CONTEXT}.scopes" "$IMS_SCOPES" --json
          aio config set "ims.contexts.${CONTEXT}.technical_account_id" "dummy@techacct.adobe.com"
          aio config set "ims.contexts.${CONTEXT}.technical_account_email" "dummy@techacct.adobe.com"

      - name: Deploy
        run: aio app deploy

      - name: Verify deployment
        run: aio runtime action list
